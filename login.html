<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Login — Stackly Agri</title>
  <meta name="description" content="Access your Stackly Agri farmer dashboard, cold-chain fleet manager console, or quality inspection panel." />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/home.css" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 1.5rem 4rem;
      background: radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
                  #050d0a;
    }
    .login-card {
      width: 100%;
      max-width: 460px;
      background: rgba(9, 23, 18, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), 0 0 40px rgba(16, 185, 129, 0.12);
      text-align: center;
    }
    .login-brand {
      margin-bottom: 2rem;
    }
    .login-brand img {
      height: 48px;
      margin: 0 auto 0.75rem;
    }
    .login-card h1 {
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .login-card p {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
    .demo-btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.8rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .demo-btn {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-mint);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.25);
      padding: 0.6rem 1rem;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .demo-btn:hover {
      background: var(--accent-mint);
      color: #050d0a;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      text-align: left;
    }
    .login-form label {
      font-size: 0.88rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.4rem;
      display: block;
    }
    .login-form input {
      width: 100%;
      background: rgba(5, 13, 10, 0.8);
      border: 1px solid var(--border-color);
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 0.98rem;
    }
    .login-form input:focus {
      border-color: var(--accent-mint);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body>

  <!-- NAVIGATION BAR -->
  <nav class="nav">
    <a class="brand" href="index.html">
      <img src="images/logoStackly.webp" alt="Stackly Agri Logo" height="45" style="filter: invert(58%) sepia(72%) saturate(400%) hue-rotate(115deg) brightness(95%) contrast(90%);" />
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="track.html">Track Harvest</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="pricing.html">Pricing</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-cta">
      <a class="btn btn-amber" href="login.html">🔐 Portal Login</a>
      <button class="burger" id="burger" aria-label="Toggle Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- MOBILE SCRIM & DRAWER -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <a class="d-link" href="index.html">🏠 Home</a>
    <a class="d-link" href="track.html">📍 Track Harvest</a>
    <a class="d-link" href="services.html">🌱 Agri Services</a>
    <a class="d-link" href="pricing.html">💰 Plans & Pricing</a>
    <a class="d-link" href="contact.html">✉️ Contact Us</a>

    <a class="btn btn-amber drawer-login" href="login.html">🔐 Portal Login</a>
  </aside>

  <!-- LOGIN MAIN CONTAINER -->
  <main class="login-page">
    <div class="login-card reveal zoom">
      
      <div class="login-brand">
        <img src="images/logoStackly.webp" alt="Stackly Agri Logo" height="45" style="filter: invert(58%) sepia(72%) saturate(400%) hue-rotate(115deg) brightness(95%) contrast(90%);" />
        <h1>Welcome Back</h1>
        <p>Sign in to your Stackly Agri Telemetry Portal</p>
      </div>

      <!-- DEMO AUTOFILL BUTTONS -->
      <div class="demo-btn-group">
        <span style="font-size: 0.78rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Quick Demo Sign-In:</span>
        <button type="button" class="demo-btn" onclick="fillDemo('farmer@greenvalley.com')">🌱 Farmer Portal Demo</button>
        <button type="button" class="demo-btn" onclick="fillDemo('logistics@stacklyfleet.com')">🚛 Cold Fleet Manager Demo</button>
        <button type="button" class="demo-btn" onclick="fillDemo('inspector@agriquality.org')">🔬 Quality Inspector Demo</button>
      </div>

      <form class="login-form" onsubmit="handleLogin(event)">
        <div>
          <label>Account Email</label>
          <input type="email" id="loginEmail" placeholder="name@farm.com" required />
        </div>

        <div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label>Password</label>
            <a href="#" style="font-size: 0.8rem; color: var(--accent-mint);" onclick="showToast('Password reset link sent!')">Forgot?</a>
          </div>
          <input type="password" id="loginPassword" value="••••••••••••" required />
        </div>

        <button type="submit" class="btn btn-emerald" style="width: 100%; margin-top: 0.5rem;">
          Sign In To Console →
        </button>
      </form>

    </div>
  </main>

  <script src="js/common.js"></script>
  <script>
    function fillDemo(email) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = 'StacklyAgri2026!';
      showToast(`Autofilled login credentials for ${email}`);
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      showToast(`Login successful! Welcome ${email.split('@')[0]}`);
      setTimeout(() => {
        window.location.href = 'track.html';
      }, 1200);
    }
  </script>
</body>
</html>
